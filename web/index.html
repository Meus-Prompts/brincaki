<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Brincaki no navegador: 12 jogos casuais em português para a família brincar.">
  <meta name="theme-color" content="#8B5CF6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Brincaki">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Brincaki</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#FFFBEB">
  <!-- Aviso enquanto o app baixa; o web/flutter_bootstrap.js tira quando o jogo abre. -->
  <div id="carregando" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#92400E">
    <img src="icons/Icon-192.png" alt="" width="96" height="96" style="border-radius:24px">
    <p style="font-size:20px;margin:16px 0 4px">Carregando o Brincaki...</p>
    <p style="font-size:14px;margin:0;color:#B45309">Na primeira vez pode demorar um pouquinho.</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
