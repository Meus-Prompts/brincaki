<!-- Personagem do ícone: carinha feliz cercada de peças dos jogos. Fundo transparente; conteúdo dentro da zona segura do ícone adaptativo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#4C1D95" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- peças flutuando -->
  <g filter="url(#sh)">
    <!-- X azul -->
    <g transform="translate(300 330) rotate(-14)">
      <rect x="-14" y="-60" width="28" height="120" rx="14" fill="#3B82F6"/>
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#3B82F6"/>
    </g>
    <!-- O verde -->
    <circle cx="738" cy="318" r="44" fill="none" stroke="#10B981" stroke-width="28"/>
    <!-- disco vermelho do Lig 4 -->
    <circle cx="282" cy="700" r="50" fill="#EF4444"/>
    <circle cx="282" cy="700" r="30" fill="none" stroke="#FCA5A5" stroke-width="8"/>
    <!-- estrela -->
    <path transform="translate(748 702) scale(1.15)" fill="#F97316"
      d="M0,-52 L14,-17 L50,-16 L22,8 L32,44 L0,23 L-32,44 L-22,8 L-50,-16 L-14,-17 Z"
      stroke="#F97316" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- carinha -->
  <g filter="url(#sh)">
    <circle cx="512" cy="522" r="190" fill="url(#face)"/>
  </g>
  <!-- olhos -->
  <ellipse cx="446" cy="478" rx="30" ry="40" fill="#3B1F5C"/>
  <ellipse cx="578" cy="478" rx="30" ry="40" fill="#3B1F5C"/>
  <circle cx="456" cy="464" r="11" fill="#fff"/>
  <circle cx="588" cy="464" r="11" fill="#fff"/>
  <!-- bochechas -->
  <ellipse cx="392" cy="560" rx="30" ry="18" fill="#F472B6" opacity="0.7"/>
  <ellipse cx="632" cy="560" rx="30" ry="18" fill="#F472B6" opacity="0.7"/>
  <!-- sorriso com língua -->
  <path d="M432,560 Q512,670 592,560 Z" fill="#3B1F5C" stroke="#3B1F5C" stroke-width="10" stroke-linejoin="round"/>
  <path d="M478,618 Q512,600 546,618 Q536,646 512,648 Q488,646 478,618 Z" fill="#F87171"/>
</svg>
